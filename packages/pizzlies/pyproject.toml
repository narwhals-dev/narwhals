[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pizzlies"
version = "0.1.0"
description = "Pure-Python eager dataframes on dicts of lists, with the Narwhals API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Raise to the first Narwhals release with `native_repr` before tagging pizzlies: the
# publish workflow runs the tests against this floor, and the repr tests need it.
dependencies = ["narwhals>=2.29.0"]

[project.urls]
Homepage = "https://github.com/narwhals-dev/narwhals"
Repository = "https://github.com/narwhals-dev/narwhals"

[project.entry-points.'narwhals.plugins']
pizzlies = 'pizzlies'

[dependency-groups]
# For running Narwhals' own test suite against this plugin, see the README.
tests = [
  "covdefaults",
  "hypothesis>=6.0.0",
  "numpy",
  "packaging>=21.3",
  "pandas",
  "polars",
  "pyarrow",
  "pytest>=9.0.3",
  "pytest-cov",
  "pytest-env",
  "pytest-randomly",
  "pytest-xdist",
]

[tool.uv]
default-groups = ["tests"]

[tool.uv.sources]
narwhals = { path = "../..", editable = true }

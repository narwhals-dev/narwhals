name: prek autoupdate

on:
  schedule:
    # Every Tuesday at 06:00 UTC, just after renovate's github-actions window.
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run prek autoupdate
        # Same 7-day supply-chain cooldown as renovate's `minimumReleaseAge`. prek never
        # downgrades: if the newest eligible rev is older than the pinned one, it keeps the pin.
        run: uvx prek autoupdate --cooldown-days 7
      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "No hook updates."
            exit 0
          fi
          branch="chore/prek-autoupdate-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .pre-commit-config.yaml
          git commit -m "chore: prek autoupdate"
          # `persist-credentials: false` leaves `origin` unauthenticated; the gh credential
          # helper supplies the token on demand instead of writing it into .git/config.
          gh auth setup-git
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "chore: prek autoupdate" \
            --body "Automated hook version bump via \`prek autoupdate\`." \
            --base main \
            --head "$branch"

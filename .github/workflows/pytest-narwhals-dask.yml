name: PyTest narwhals-dask

on:
  pull_request:
    paths:
      - src/narwhals/**
      - tests/**
      - packages/narwhals-dask/**
      - .github/workflows/pytest-narwhals-dask.yml
      - pyproject.toml
  workflow_call:

env:
  PY_COLORS: 1
  PYTEST_ADDOPTS: "--numprocesses=logical"
  UV_LOCKED: 1

permissions:
  contents: read

jobs:
  pytest-narwhals-dask:
    if: github.head_ref != 'bump-version'
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: "true"
          cache-suffix: narwhals-dask-${{ matrix.python-version }}
          cache-dependency-glob: "packages/narwhals-dask/pyproject.toml"
      - name: Run Narwhals' test suite against narwhals-dask
        run: python packages/narwhals-dask/run_tests.py

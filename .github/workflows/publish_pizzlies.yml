# Publishes `packages/pizzlies` to PyPI with trusted publishing.
#
# Triggered by tags like `pizzlies-v0.1.0`, which the main `publish_to_pypi.yml`
# (`v[0-9]+.[0-9]+.[0-9]+*`) doesn't match, so the two releases never collide.
#
# One-off setup:
#   1. On PyPI, add a (pending) trusted publisher for project `pizzlies`:
#      owner `narwhals-dev`, repository `narwhals`, workflow `publish_pizzlies.yml`,
#      environment `pypi-pizzlies`.
#   2. In the repository settings, create the `pypi-pizzlies` environment.

name: Publish pizzlies to PyPI

on:
  push:
    tags:
      - "pizzlies-v[0-9]+.[0-9]+.[0-9]+*"

env:
  UV_LOCKED: 1

permissions: {}

jobs:
  pytest-pizzlies:
    name: PyTest pizzlies
    uses: $/.github/workflows/pytest-pizzlies.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs:
      - pytest-pizzlies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/pizzlies

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "pizzlies-v$version" ]; then
            echo "Tag $TAG does not match pizzlies version $version" >&2
            exit 1
          fi
      - name: Build a binary wheel and a source tarball
        run: uv build --out-dir dist
      - name: Smoke tests and pizzlies' own tests (wheel and sdist, minimum and latest Narwhals)
        run: |
          version="$(uv version --short)"
          floor="$(grep -oP '"narwhals>=\K[^",]+' pyproject.toml)"
          if [ -z "$floor" ]; then
            echo "Could not find the narwhals>= floor in pyproject.toml" >&2
            exit 1
          fi
          for dist in dist/*.whl dist/*.tar.gz; do
          for narwhals in "narwhals==$floor" "narwhals"; do
            echo "Smoke testing $dist with $narwhals"
            uv run --isolated --no-project --with "$dist" --with "$narwhals" python -c '
          import warnings
          warnings.simplefilter("error")
          import narwhals as nw
          import pizzlies as pz
          print("narwhals", nw.__version__)
          df = nw.from_native({"a": [1, 2, 3], "g": [1, 1, 2]}, eager_only=True)
          assert type(df._compliant_frame).__module__.startswith("pizzlies")
          assert df.select(nw.col("a").sum()).item() == 6
          # `group_by` and `over` read `_metadata`, which has no stability guarantee.
          result = df.group_by("g").agg(nw.col("a").sum()).sort("g")
          assert result["a"].to_list() == [3, 3]
          result = df.with_columns(b=nw.col("a").sum().over("g")).sort("a")
          assert result["b"].to_list() == [3, 3, 3]
          assert pz.from_dict({"a": [1, 2]}).shape == (2, 1)
          # Needs the `native_repr` hook, else Narwhals prints the raw dict.
          assert "shape: (2, 1)" in repr(pz.from_dict({"a": [1, 2]}))
          assert pz.__version__ == "'"$version"'"
          '
          # `-c pyproject.toml` keeps the repository's pytest config (and its
          # `pythonpath = ["src"]`, which would shadow the installed Narwhals) out.
          uv run --isolated --no-project --with "$dist" --with "$narwhals" \
            --with pytest --with numpy --with polars --with pyarrow \
            pytest -c pyproject.toml -p no:cacheprovider -q tests
          done
          done
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pizzlies-distributions
          path: packages/pizzlies/dist/

  publish-to-pypi:
    name: Publish pizzlies to PyPI
    if: startsWith(github.ref, 'refs/tags/pizzlies-v')
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi-pizzlies
      url: https://pypi.org/p/pizzlies
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pizzlies-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

# Publishes `packages/narwhals-dask` to PyPI with trusted publishing.
#
# Triggered by tags like `narwhals-dask-v0.1.0`, which the main `publish_to_pypi.yml`
# (`v[0-9]+.[0-9]+.[0-9]+*`) doesn't match, so the two releases never collide.
#
# One-off setup:
#   1. On PyPI, add a (pending) trusted publisher for project `narwhals-dask`:
#      owner `narwhals-dev`, repository `narwhals`, workflow `publish_narwhals_dask.yml`,
#      environment `pypi-narwhals-dask`.
#   2. In the repository settings, create the `pypi-narwhals-dask` environment.

name: Publish narwhals-dask to PyPI

on:
  push:
    tags:
      - "narwhals-dask-v[0-9]+.[0-9]+.[0-9]+*"

env:
  UV_LOCKED: 1

permissions: {}

jobs:
  pytest-narwhals-dask:
    name: PyTest narwhals-dask
    uses: $/.github/workflows/pytest-narwhals-dask.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs:
      - pytest-narwhals-dask
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/narwhals-dask

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "narwhals-dask-v$version" ]; then
            echo "Tag $TAG does not match narwhals-dask version $version" >&2
            exit 1
          fi
      - name: Build a binary wheel and a source tarball
        run: uv build --out-dir dist
      - name: Smoke tests (wheel and source distribution)
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$dist" --with pandas python -c '
          import warnings
          warnings.simplefilter("error")
          import dask.dataframe as dd
          import narwhals as nw
          df = nw.from_native(dd.from_dict({"a": [1, 2, 3]}, npartitions=1))
          assert type(df._compliant_frame).__module__.startswith("narwhals_dask")
          assert df.select(nw.col("a").sum()).collect().item() == 6
          '
          done
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narwhals-dask-distributions
          path: packages/narwhals-dask/dist/

  publish-to-pypi:
    name: Publish narwhals-dask to PyPI
    if: startsWith(github.ref, 'refs/tags/narwhals-dask-v')
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi-narwhals-dask
      url: https://pypi.org/p/narwhals-dask
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narwhals-dask-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

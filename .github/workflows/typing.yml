name: Type checking

on:
  pull_request:
    paths:
      - "**.py"
      - .github/workflows/typing.yml
      - pyproject.toml
      - uv.lock
  workflow_call:

env:
  PY_COLORS: 1
  UV_LOCKED: 1
  UV_NO_DEV: 1

permissions:
  contents: read

jobs:
  typing:
    if: github.head_ref != 'bump-version'
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true
          enable-cache: "true"
          cache-suffix: typing-${{ matrix.python-version }}
          cache-dependency-glob: "pyproject.toml"
      - name: Create venv
        run: uv venv .venv --clear
      - name: install-reqs
        # TODO: add more dependencies/backends incrementally
        run: uv pip install -e ".[pyspark]" --group typing
      - name: show-deps
        run: uv pip freeze
      - name: Run mypy and pyright
        run: make typing
      - name: Check type-completeness
        run: |
          uv run pyrefly coverage check src/narwhals --public-only
